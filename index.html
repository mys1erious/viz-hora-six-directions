<script>
const Q = new URLSearchParams(location.search);
const CLEAN = Q.has('clean'), PLAY = Q.has('play');
if (CLEAN) document.body.classList.add('clean');
const AW = 540, AH = 675;

// seeded PRNG (mulberry32) and a stateless hash for per-moment randomness
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash = n => mulberry32(n * 9973 + 6)();
const clamp = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P = (lt,a,b)=>clamp((lt-a)/(b-a));
const eo = x=>1-Math.pow(1-x,4), eio = x=>x<.5?8*x*x*x*x:1-Math.pow(-2*x+2,4)/2;
const back = x=>{const c=1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k;
const pad=n=>String(Math.floor(n)).padStart(2,'0');
// the watch shows 10:08:32 at t=0 and keeps running
const T0 = 10*3600 + 8*60 + 32;
const clock = t=>{const s=T0+t;return{s, sec:(s%60)*6, min:(s/60%60)*6, hr:(s/3600%12)*30, txt:`${pad(s/3600%24)}:${pad(s/60%60)}:${pad(s%60)}`}};
const svgRot=(el,a)=>el.setAttribute('transform',`rotate(${a.toFixed(3)})`);
const ticks=(n,f)=>Array.from({length:n},(_,i)=>f(i)).join('');
const COPY = {h:'Time, kept by hand.', sub:'A hand-wound watch with a 72-hour reserve. 38 mm steel, made in batches of 600.', price:'€390'};

const STYLES = [
{ key:'sw', name:'Swiss poster', short:'Swiss', focus:[380,252],
  note:'A six-column grid, flush-left type, a numeral too big for the page and one red hand.',
  type:'Archivo 900 · 800 · 400', pal:['#f3c613','#121110','#f7f5f0','#e1251b'],
  html:()=>`<div class="sw-grid"></div>
  <div class="sw-top"><b>HORA</b><span>No. 6</span><nav>Watch Movement Journal Reserve</nav></div>
  <div class="sw-rule"></div>
  <div class="sw-big"><span>6</span></div>
  <svg class="sw-watch" viewBox="-140 -140 280 280">
    <circle r="139" fill="#f3c613"/><circle r="126" fill="#f7f5f0" stroke="#121110" stroke-width="11"/>
    ${ticks(60,i=>i%5?`<rect x="-1.3" y="-117" width="2.6" height="9" fill="#121110" transform="rotate(${i*6})"/>`:`<rect x="${i?-5:-8}" y="-117" width="${i?10:16}" height="34" fill="#121110" transform="rotate(${i*6})"/>`)}
    <text y="-48" text-anchor="middle" font-size="13" font-weight="900" letter-spacing="1">HORA</text>
    <text y="62" text-anchor="middle" font-size="10" font-weight="800" letter-spacing="2">72 H</text>
    <g class="hh"><rect x="-7" y="-74" width="14" height="92" fill="#121110"/></g>
    <g class="mh"><rect x="-5" y="-110" width="10" height="128" fill="#121110"/></g>
    <g class="sh"><rect x="-1.6" y="-114" width="3.2" height="146" fill="#e1251b"/></g>
    <circle r="5.5" fill="#e1251b"/></svg>
  <div class="sw-h"><span class="ln"><span>Time,</span></span><span class="ln"><span>kept by</span></span><span class="ln"><span>hand.</span></span></div>
  <div class="sw-sub">${COPY.sub}</div>
  <div class="sw-cta"><span>Reserve one · ${COPY.price}</span><i>→</i></div>
  <div class="sw-spec"><div><small>Calibre</small><b>H-6</b></div><div><small>Reserve</small><b class="n" data-n="72" data-u=" h">72 h</b></div><div><small>Case</small><b class="n" data-n="38" data-u=" mm">38 mm</b></div><div><small>Batch</small><b class="n" data-n="600" data-u="">600</b></div></div>`,
  init(el){ this.r={hh:el.querySelector('.hh'),mh:el.querySelector('.mh'),sh:el.querySelector('.sh'),big:el.querySelector('.sw-big span'),rule:el.querySelector('.sw-rule'),ln:[...el.querySelectorAll('.sw-h .ln span')],n:[...el.querySelectorAll('.sw-spec .n')]}; },
  update(el,t,lt){ const r=this.r,c=clock(t);
    svgRot(r.hh,c.hr); svgRot(r.mh,c.min); svgRot(r.sh,c.sec);
    r.big.style.transform=`translateY(${(1-eo(P(lt,0,.8)))*100}%)`;
    r.rule.style.transform=`scaleX(${eo(P(lt,.05,.7))})`;
    r.ln.forEach((s,i)=>s.style.transform=`translateY(${(1-eo(P(lt,.12+i*.08,.72+i*.08)))*110}%)`);
    const k=eo(P(lt,.2,1.2)); r.n.forEach(b=>b.textContent=Math.round(b.dataset.n*k)+b.dataset.u);
  }},
{ key:'tm', name:'Amber terminal', short:'Amber', focus:[166,276],
  note:'One phosphor colour, scanlines, a radar sweep that follows the seconds hand, copy as command output.',
  type:'VT323', pal:['#120c05','#ffb43a','#ffe2a8','#ff5a2a'],
  html:()=>`<div class="tm-top"><span>HORA/OS 6.0 · tty1</span><span class="tc">10:08:32</span></div>
  <div class="tm-cmd"></div>
  <div class="tm-sweep"></div>
  <svg class="tm-watch" viewBox="-130 -130 260 260" fill="none" stroke="#ffb43a">
    <circle r="124" stroke-opacity=".55"/><circle r="98" stroke-opacity=".4" stroke-dasharray="2 6"/>
    <path d="M-124 0H124M0 -124V124" stroke-opacity=".18" stroke-dasharray="3 5"/>
    ${ticks(60,i=>`<line y1="${i%5?-112:-104}" y2="-121" stroke-width="${i%5?1.2:3}" transform="rotate(${i*6})"/>`)}
    ${ticks(12,i=>{const a=i*Math.PI/6;return`<text x="${(Math.sin(a)*84).toFixed(1)}" y="${(-Math.cos(a)*84+6).toFixed(1)}" text-anchor="middle" font-size="19" fill="#ffb43a" stroke="none">${i||12}</text>`})}
    <g class="hh"><line y1="10" y2="-56" stroke-width="5"/></g>
    <g class="mh"><line y1="12" y2="-88" stroke-width="3"/></g>
    <g class="sh"><line y1="22" y2="-114" stroke-width="1.6" stroke="#ffe2a8"/></g>
    <rect x="-4" y="-4" width="8" height="8" fill="#ffe2a8" stroke="none"/></svg>
  <div class="tm-read"></div>
  <div class="tm-h"></div><div class="tm-g"></div>
  <div class="tm-sub">// hand-wound · 72 h reserve · batch of 600</div>
  <div class="tm-cta">[ RESERVE ONE  ${COPY.price} ]</div>
  <div class="tm-bar"></div>
  <div class="tm-scan"></div>`,
  init(el){ this.r={hh:el.querySelector('.hh'),mh:el.querySelector('.mh'),sh:el.querySelector('.sh'),tc:el.querySelector('.tc'),cmd:el.querySelector('.tm-cmd'),sw:el.querySelector('.tm-sweep'),rd:el.querySelector('.tm-read'),h:el.querySelector('.tm-h'),g:el.querySelector('.tm-g'),bar:el.querySelector('.tm-bar'),cta:el.querySelector('.tm-cta')};
    this.r.sw.style.background='conic-gradient(from 0deg,rgba(255,180,58,0) 0deg,rgba(255,180,58,0) 290deg,rgba(255,180,58,.34) 360deg)'; },
  update(el,t,lt){ const r=this.r,c=clock(t);
    svgRot(r.hh,c.hr); svgRot(r.mh,c.min); svgRot(r.sh,c.sec);
    r.sw.style.transform=`rotate(${c.sec}deg)`;
    r.tc.textContent=c.txt;
    const cur=(Math.floor(t*2.2)%2)?'█':' ';
    const cmd='hora@no6:~$ ./reserve --model 06';
    const nc=Math.floor(lt*44); r.cmd.textContent=cmd.slice(0,nc)+(nc<cmd.length?'█':'');
    const head='TIME, KEPT\nBY HAND.', nh=Math.floor(P(lt,.35,1)*head.length);
    const txt=head.slice(0,nh)+(nh<head.length?'█':cur); r.h.textContent=txt;
    // glitch: a short horizontal shake on a seeded schedule
    const b=Math.floor(t*10), on=hash(b)<.09 && lt>1;
    r.g.textContent=txt; r.g.style.opacity=on?.85:0; r.g.style.transform=`translate(${on?(hash(b+7)*12-6):0}px,0)`;
    r.h.style.transform=on?`translateX(${hash(b+3)*6-3}px)`:'';
    const left=72*3600-t, n=Math.floor(Math.min(1,P(lt,.2,.9))*5);
    const rows=[['TIME   ',c.txt],['RESERVE',`${pad(left/3600)}:${pad(left/60%60)}:${pad(left%60)}`],['BEAT   ','21600/h'],['CASE   ','38MM STEEL'],['BATCH  ','212/600 LEFT']];
    r.rd.innerHTML=rows.slice(0,n).map(([k,v])=>`<span class="k">${k}</span> ${v}`).join('\n');
    const fill=Math.round(P(lt,.3,1.1)*10); r.bar.textContent=`PWR [${'█'.repeat(fill)}${'░'.repeat(10-fill)}] ${fill*10}%`;
    el.style.opacity=.965+.035*Math.sin(t*53);
  }},
{ key:'cl', name:'Clay toy', short:'Clay', focus:[270,262],
  note:'Soft light from the top left, puffy volumes, a sticker, and a button that squishes when pressed.',
  type:'Fredoka 700 · 500', pal:['#ffd9c4','#ff6f4f','#2b2f5c','#9fe3c4','#ffd66e'],
  html:()=>{
    const B=[[452,312,62,'#9fe3c4'],[38,150,48,'#ffd66e'],[470,500,44,'#9cc9ff'],[60,372,30,'#9fe3c4'],[112,92,22,'#9cc9ff'],[505,236,26,'#ffd66e']];
    const blobs=B.map(([x,y,s,c],i)=>`<div class="cl-blob" data-i="${i}" style="left:${x-s/2}px;top:${y-s/2}px;width:${s}px;height:${s}px;background:radial-gradient(circle at 34% 30%,#fff 0,${c} 42%,color-mix(in oklab,${c},#7a3b20 22%))"></div>`).join('');
    const ix=ticks(12,i=>{const a=i*Math.PI/6,R=72,big=i%3==0,w=big?12:10,h=big?26:10,col=big?'#9fe3c4':'#2b2f5c';
      return `<div class="cl-ix" style="left:${92+Math.sin(a)*R-w/2}px;top:${92-Math.cos(a)*R-h/2}px;width:${w}px;height:${h}px;background:${i==0?'#ffd66e':col};transform:rotate(${i*30}deg)"></div>`});
    const hand=(c,w,len,col)=>`<div class="cl-hand ${c}" style="left:${-w/2}px;top:${-len}px;width:${w}px;height:${len+w}px;background:${col};transform-origin:50% ${len}px"></div>`;
    return `${blobs}<div class="cl-nav"><b>hora</b><i>No.6</i><span>shop</span><span>story</span></div>
    <div class="cl-watch"><div class="cl-strap t"></div><div class="cl-strap b"></div><div class="cl-crown"></div><div class="cl-case"></div>
      <div class="cl-dial">${ix}</div>${hand('h',18,52,'#2b2f5c')}${hand('m',13,76,'#2b2f5c')}${hand('s',5,82,'#ff6f4f')}<div class="cl-cap"></div></div>
    <div class="cl-stk"><b>72h</b><span>reserve</span></div>
    <h1 class="cl-h">${'Time, kept<br>by hand.'.split(' ').map(w=>w.includes('<br>')?w.split('<br>').map(x=>`<span class="w">${x}</span>`).join('<br>'):`<span class="w">${w}</span>`).join(' ')}</h1>
    <p class="cl-sub">Hand-wound, with a 72-hour reserve. Made 600 at a time.</p>
    <div class="cl-cta">Reserve · ${COPY.price}</div>`},
  init(el){ this.r={w:el.querySelector('.cl-watch'),h:el.querySelector('.cl-hand.h'),m:el.querySelector('.cl-hand.m'),s:el.querySelector('.cl-hand.s'),stk:el.querySelector('.cl-stk'),bl:[...el.querySelectorAll('.cl-blob')],wd:[...el.querySelectorAll('.cl-h .w')],cta:el.querySelector('.cl-cta')}; },
  update(el,t,lt){ const r=this.r,c=clock(t);
    // seconds hand ticks with a springy settle
    const fs=c.s%1, sa=Math.floor(c.s%60)*6 + 6*(1-Math.exp(-fs*14)*Math.cos(fs*22));
    r.h.style.transform=`rotate(${c.hr}deg)`; r.m.style.transform=`rotate(${c.min}deg)`; r.s.style.transform=`rotate(${sa}deg)`;
    const pop=back(P(lt,0,.6));
    r.w.style.transform=`translateY(${Math.sin(t*1.6)*4}px) rotate(${Math.sin(t*1.1)*2.5}deg) scale(${.85+.15*pop})`;
    r.stk.style.transform=`rotate(${-10+Math.sin(t*1.3)*7}deg) scale(${back(P(lt,.25,.75))})`;
    r.bl.forEach((b,i)=>b.style.transform=`translateY(${Math.sin(t*(1.1+i*.17)+i*2)*7}px) scale(${back(P(lt,.05*i,.5+.05*i))})`);
    r.wd.forEach((w,i)=>{const k=back(P(lt,.15+i*.07,.6+i*.07)); w.style.transform=`translateY(${(1-k)*30}px) scale(${.7+.3*k})`; w.style.opacity=P(lt,.15+i*.07,.35+i*.07)});
    const pp=(t+1.2)%2.6, sq=pp<.12?Math.sin(pp/.12*Math.PI):0;
    r.cta.style.transform=`scale(${1+.05*sq},${1-.09*sq})`;
  }},
{ key:'dk', name:'1-bit desktop', short:'1-bit', focus:[174,200],
  note:'Two colours only. Dithered shading, hard shadows, pinstriped title bars and windows that zoom open.',
  type:'Pixelify Sans 700 · 400', pal:['#f5f2ea','#16140f'],
  html:()=>`<div class="dk-bar"><span class="lg">H</span><span>File</span><span>Edit</span><span>View</span><span class="sp">Special</span><span class="ck">10:08 AM</span></div>
  <div class="dk-ico" style="left:418px;top:58px"><svg width="40" height="40" viewBox="0 0 20 20"><path d="M2 2h14l2 2v14H2z" fill="#f5f2ea" stroke="#16140f" stroke-width="1.5"/><path d="M5 2h9v6H5z" fill="#16140f"/><path d="M11 3h2v4h-2z" fill="#f5f2ea"/><path d="M5 11h10v6H5z" fill="#f5f2ea" stroke="#16140f"/></svg><span>Movement</span></div>
  <div class="dk-ico" style="left:418px;top:146px"><svg width="40" height="40" viewBox="0 0 20 20"><path d="M4 1h9l4 4v14H4z" fill="#f5f2ea" stroke="#16140f" stroke-width="1.5"/><path d="M13 1v4h4" fill="none" stroke="#16140f" stroke-width="1.5"/><path d="M7 9h7M7 12h7M7 15h5" stroke="#16140f" stroke-width="1.3"/></svg><span>Journal</span></div>
  <div class="dk-ico" style="left:418px;top:234px"><svg width="40" height="40" viewBox="0 0 20 20"><circle cx="10" cy="11" r="7" fill="#f5f2ea" stroke="#16140f" stroke-width="1.5"/><path d="M10 7v4h3" fill="none" stroke="#16140f" stroke-width="1.5"/><path d="M4 3l3 2M16 3l-3 2" stroke="#16140f" stroke-width="1.5"/></svg><span>Alarm</span></div>
  <div class="dk-win dk-a"><div class="dk-tb"><span>HORA No.6</span></div><canvas width="120" height="120"></canvas><div class="st"><span>Hand-wound</span><span>72 h reserve</span></div></div>
  <div class="dk-win dk-c"><div class="dk-tb"><span>Alarm</span></div><b class="al">10:08:32</b></div>
  <div class="dk-zr"></div><div class="dk-zr"></div><div class="dk-zr"></div>
  <div class="dk-win dk-b act"><div class="dk-tb"><i class="cb"></i><span>Read Me</span></div>
    <h2>Time, kept<br>by hand.<span class="dk-car"></span></h2>
    <p>${COPY.sub}</p>
    <div class="pr">EUR 390</div>
    <div class="dk-btn" style="left:118px;top:226px;width:64px">Later</div>
    <div class="dk-btn def" style="left:194px;top:226px;width:96px">Reserve</div></div>`,
  init(el){
    const cv=el.querySelector('canvas'), N=120, base=new Uint8Array(N*N), C=59.5;
    const put=(b,x,y)=>{x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<N&&y<N)b[y*N+x]=1};
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){const d=Math.hypot(x-C,y-C);
      if(d>=55&&d<58.5)base[y*N+x]=1; else if(d>=50&&d<55&&(x+y)%2==0)base[y*N+x]=1; else if(d>=48.6&&d<50)base[y*N+x]=1;}
    for(let i=0;i<60;i++){const a=i*Math.PI/30, r0=i%5?44:38;for(let r=r0;r<=46;r+=.5){put(base,C+Math.sin(a)*r,C-Math.cos(a)*r);if(i%5==0)put(base,C+Math.sin(a)*r+Math.cos(a),C-Math.cos(a)*r+Math.sin(a))}}
    const F={'1':'010110010010111','2':'111001111100111','3':'111001111001111','6':'111100111101111','9':'111101111001111'};
    const txt=(s,cx,cy)=>{const w=s.length*4-1;[...s].forEach((ch,k)=>{const g=F[ch];for(let j=0;j<15;j++)if(g[j]=='1')for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++)put(base,cx-w+k*8+(j%3)*2+dx,cy-5+Math.floor(j/3)*2+dy)})};
    txt('12',C+1,C-28); txt('3',C+30,C+1); txt('6',C+1,C+29); txt('9',C-28,C+1);
    this.r={cv,ctx:cv.getContext('2d'),img:cv.getContext('2d').createImageData(N,N),base,N,C,put,
      ck:el.querySelector('.ck'),al:el.querySelector('.al'),car:el.querySelector('.dk-car'),b:el.querySelector('.dk-b'),zr:[...el.querySelectorAll('.dk-zr')],sp:el.querySelector('.sp')};
  },
  update(el,t,lt){ const r=this.r,c=clock(t),{N,C}=r,buf=r.base.slice();
    const hand=(deg,len,w,tail=0)=>{const a=deg*Math.PI/180,sx=Math.sin(a),cy=-Math.cos(a);for(let k=-tail;k<=len;k+=.4)for(let o=-(w-1)/2;o<=(w-1)/2;o+=.5)r.put(buf,C+sx*k-cy*o,C+cy*k+sx*o)};
    hand(c.hr,24,3.5); hand(c.min,36,2.5); hand(c.sec,42,1,8);
    for(let y=-2;y<=2;y++)for(let x=-2;x<=2;x++)if(x*x+y*y<=5)r.put(buf,C+x,C+y);
    const d=r.img.data; for(let i=0;i<N*N;i++){const v=buf[i]?22:245;d[i*4]=v;d[i*4+1]=buf[i]?20:242;d[i*4+2]=buf[i]?15:234;d[i*4+3]=255}
    r.ctx.putImageData(r.img,0,0);
    r.ck.textContent=`${Math.floor(c.s/3600%12)||12}:${pad(c.s/60%60)} AM`; r.al.textContent=c.txt;
    r.car.style.visibility=(Math.floor(t*1.8)%2)?'hidden':'visible';
    r.sp.className=(t%5>3.8&&t%5<4.4)?'sp on':'sp';
    // zoom-rect open animation from the Journal icon to the Read Me window
    const z=P(lt,0,.42); const from=[438,150,44,44], to=[208,312,308,274];
    r.zr.forEach((e,i)=>{const k=eio(clamp(z*1.25-i*.12));const R=from.map((f,j)=>lerp(f,to[j],k));
      Object.assign(e.style,{left:R[0]+'px',top:R[1]+'px',width:R[2]+'px',height:R[3]+'px',opacity:(z>0&&z<1&&k>0)?1:0})});
    r.b.style.visibility=lt<.42?'hidden':'visible';
  }},
{ key:'ik', name:'Sumi ink', short:'Sumi', focus:[215,268],
  note:'Vertical type, a brushed ensō for a dial, a vermilion seal and a lot of paper left empty.',
  type:'Shippori Mincho 800 · 500', pal:['#ece5d6','#1c1915','#c4402b'],
  html:()=>`<div class="ik-top"><span>HORA ／ No.6</span><span>時計 ・ 第六号</span></div>
  <canvas class="ik-enso" width="960" height="960"></canvas>
  <svg class="ik-hands" viewBox="-160 -160 320 320">
    ${ticks(4,i=>`<line y1="-104" y2="-94" stroke="#1c1915" stroke-width="2" transform="rotate(${i*90})"/>`)}
    <g class="hh"><line y1="12" y2="-62" stroke="#1c1915" stroke-width="3.2" stroke-linecap="round"/></g>
    <g class="mh"><line y1="14" y2="-98" stroke="#1c1915" stroke-width="2" stroke-linecap="round"/></g>
    <g class="sh"><line y1="22" y2="-108" stroke="#c4402b" stroke-width="1.1"/></g>
    <circle r="3.6" fill="#1c1915"/><circle r="1.4" fill="#c4402b"/></svg>
  <div class="ik-v">${'手で巻く、<br>静かな時間。'.split('<br>').map(s=>[...s].map(ch=>`<span class="c">${ch}</span>`).join('')).join('<br>')}</div>
  <div class="ik-v2">第六号 手巻き時計</div>
  <div class="ik-seal">刻</div>
  <div class="ik-rule"></div>
  <div class="ik-h">${COPY.h}</div>
  <div class="ik-sub">A hand-wound watch with a seventy-two hour reserve. Thirty-eight millimetres of steel, made in batches of six hundred.</div>
  <div class="ik-cta">Reserve one, ${COPY.price} <i>→</i></div>
  <div class="ik-fo2">二〇二六年 秋</div>
  <div class="ik-fo">— 06</div>`,
  init(el){
    // washi: seeded speckle and fibres, tiled
    const pc=document.createElement('canvas'); pc.width=pc.height=240; const px=pc.getContext('2d'), rnd=mulberry32(11);
    for(let i=0;i<2600;i++){px.fillStyle=`rgba(60,45,25,${rnd()*.07})`;px.fillRect(rnd()*240,rnd()*240,1+rnd()*1.5,1+rnd()*1.5)}
    px.lineWidth=.6; for(let i=0;i<70;i++){const x=rnd()*240,y=rnd()*240,a=rnd()*6.28,l=6+rnd()*18;px.strokeStyle=`rgba(90,70,40,${.05+rnd()*.08})`;px.beginPath();px.moveTo(x,y);px.quadraticCurveTo(x+Math.cos(a)*l/2+rnd()*4,y+Math.sin(a)*l/2+rnd()*4,x+Math.cos(a)*l,y+Math.sin(a)*l);px.stroke()}
    el.style.backgroundImage=`url(${pc.toDataURL()})`; el.style.backgroundSize='240px';
    // ensō: pre-rendered dry-brush stroke, revealed with an angular clip
    const off=document.createElement('canvas'); off.width=off.height=960; const o=off.getContext('2d'), S=3, R=128*S, cx=480, cy=480, A0=-1.9, SW=5.75;
    const br=mulberry32(5), NB=34, bristle=Array.from({length:NB},(_,j)=>({o:(j/(NB-1)-.5),dry:.55+br()*.45,ph:br()*10,ink:.75+br()*.25}));
    o.fillStyle='#1c1915';
    for(let k=0;k<=2400;k++){const u=k/2400, a=A0+u*SW;
      const press=Math.min(1,u/.04)*(1-.55*Math.pow(u,1.6))*(1+.12*Math.sin(u*17)), w=27*S*press;
      const rr=R*(1+.035*Math.sin(u*5.3+1)-.02*u);
      for(const b of bristle){ if(u>b.dry && (Math.sin(u*90+b.ph)>-.2 || u>b.dry+.12)) continue;
        const rad=rr+b.o*w, x=cx+Math.cos(a)*rad, y=cy+Math.sin(a)*rad; o.globalAlpha=b.ink*(u<.03?1:.9);
        o.beginPath(); o.arc(x,y,Math.max(.6,w/NB*1.25),0,6.283); o.fill(); }
    }
    o.globalAlpha=1;
    this.r={c:el.querySelector('.ik-enso').getContext('2d'),off,A0,SW,hh:el.querySelector('.hh'),mh:el.querySelector('.mh'),sh:el.querySelector('.sh'),seal:el.querySelector('.ik-seal'),ch:[...el.querySelectorAll('.ik-v .c')],last:-1};
  },
  update(el,t,lt){ const r=this.r,c=clock(t);
    svgRot(r.hh,c.hr); svgRot(r.mh,c.min); svgRot(r.sh,c.sec);
    const p=eio(P(lt,0,1.15));
    if(p!==r.last){ const g=r.c; g.clearRect(0,0,960,960);
      if(p>0){ g.save(); g.beginPath(); g.moveTo(480,480); g.arc(480,480,700,r.A0-.35,r.A0-.35+(r.SW+.5)*p); g.closePath(); g.clip(); g.drawImage(r.off,0,0); g.restore(); }
      r.last=p; }
    const s=P(lt,1.05,1.3); r.seal.style.opacity=s>0?1:0; r.seal.style.transform=`rotate(-5deg) scale(${1.35-.35*eo(s)})`;
    r.ch.forEach((e,i)=>{const k=P(lt,.2+i*.06,.6+i*.06); e.style.opacity=k; e.style.transform=`translateY(${(1-eo(k))*-14}px)`});
  }},
{ key:'mx', name:'Maison noir', short:'Noir', focus:[270,272],

    ${ticks(12,i=>{const a=i*Math.PI/6,R=i%3?0:106,lab=['XII','III','VI','IX'][i/3];
      return i%3?`<line y1="-118" y2="-133" stroke="url(#mxg)" stroke-width="2" transform="rotate(${i*30})"/>`:`<text x="${(Math.sin(a)*R).toFixed(1)}" y="${(-Math.cos(a)*R+10).toFixed(1)}" text-anchor="middle" font-size="29" fill="#efe6d6">${lab}</text>`})}

  init(el){ this.r={hh:el.querySelector('.hh'),mh:el.querySelector('.mh'),sh:el.querySelector('.sh'),c1:el.querySelector('.mx-c1'),c2:el.querySelector('.mx-c2'),shine:el.querySelector('.mx-sh'),top:el.querySelector('.mx-top b'),h:el.querySelector('.mx-h'),sub:el.querySelector('.mx-sub'),cta:el.querySelector('.mx-cta')}; },
  update(el,t,lt){ const r=this.r,c=clock(t);
    svgRot(r.hh,c.hr); svgRot(r.mh,c.min); svgRot(r.sh,c.sec);

// ── build ──
const stage=document.getElementById('stage'), wrap=document.getElementById('wrap'), cam=document.getElementById('cam'), rip=document.getElementById('rip');
const N=STYLES.length, GW=156, GH=195;
const gridRect=i=>[24+(i%3)*(GW+12), 166+Math.floor(i/3)*(GH+42), GW, GH];
const tiles=STYLES.map((s,i)=>{
  const tile=document.createElement('div'); tile.className='tile'; tile.dataset.i=i;
  const art=document.createElement('div'); art.className='art s-'+s.key; art.innerHTML=s.html(); tile.append(art);
  const lab=document.createElement('div'); lab.className='tlabel'; lab.innerHTML=`<b>0${i+1}</b>${s.name}`;
  cam.append(tile, lab); s.init(art); return {tile,art,lab};
});
const chips=document.getElementById('chips'), spec=document.getElementById('spec');
['All',...STYLES.map(s=>s.short)].forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=e=>{i?go(i-1,e):toGrid()};chips.append(b)});

// ── view state ──
const now=()=>performance.now()/1000;
const act=STYLES.map(()=>-100);           // activation time per style, drives its intro
let mode='grid', cur=0, zoom=null, wipe=null;  // zoom: {dir:+1 in / -1 out, t0}; wipe: {to,t0,x,y}
const ZD=.85, WD=.8;
function toGrid(){ if(mode!=='single')return; finishWipe(); mode='zoom'; zoom={dir:-1,t0:now()}; sync(); }
function go(i,e){
  i=(i+N)%N;
  const pt=e&&e.clientX!==undefined&&stage.contains(e.target)?(()=>{const R=wrap.getBoundingClientRect(),k=R.width/AW;return[(e.clientX-R.left)/k,(e.clientY-R.top)/k]})():null;
  if(mode==='grid'){ cur=i; mode='zoom'; zoom={dir:1,t0:now()}; if(pt||PLAY)ripple=[...(pt||gridCenter(i)),now()]; sync(); return; }
  if(mode!=='single'||i===cur) return;
  finishWipe(); const [x,y]=pt||STYLES[cur].focus;
  wipe={to:i,t0:now(),x,y}; act[i]=now(); if(pt||PLAY)ripple=[x,y,now()]; sync(i);
}
let ripple=null; const gridCenter=i=>{const g=gridRect(i);return[g[0]+g[2]/2,g[1]+g[3]/2]};
function finishWipe(){ if(wipe){cur=wipe.to;wipe=null} }
function sync(show=cur){
  [...chips.children].forEach((b,i)=>b.setAttribute('aria-pressed', String(mode==='grid'||(mode==='zoom'&&zoom.dir<0)?i===0:i===show+1)));
  if(mode==='grid'||(mode==='zoom'&&zoom.dir<0)) spec.innerHTML=`<h2>Six directions</h2><p>One fictional watch and one set of words. Only the art direction changes: type, colour, layout, motion and the dial itself.</p>`;
  else{const s=STYLES[show]; spec.innerHTML=`<h2>${s.name}</h2><p>${s.note}</p><div class="type">${s.type}</div><div class="sw">${s.pal.map(c=>`<i style="background:${c}" title="${c}"></i>`).join('')}</div>`}
}
let swiped=false;
stage.addEventListener('click',e=>{ if(PLAY)return; if(swiped){swiped=false;return} const t=e.target.closest('.tile'); if(mode==='grid'&&t) go(+t.dataset.i,e); else if(mode==='single') go((wipe?wipe.to:cur)+1,e); });
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')go((wipe?wipe.to:cur)+1); else if(e.key==='ArrowLeft')go((wipe?wipe.to:cur)-1);
  else if(e.key==='Escape'||e.key==='0')toGrid(); else if(e.key>='1'&&e.key<='6'){ if(mode==='grid'){go(+e.key-1)} else go(+e.key-1); }
});
let sx=null; wrap.addEventListener('pointerdown',e=>{sx=[e.clientX,e.clientY]});
wrap.addEventListener('pointerup',e=>{ if(!sx||mode!=='single')return; const dx=e.clientX-sx[0],dy=e.clientY-sx[1]; sx=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){ swiped=true; go((wipe?wipe.to:cur)+(dx<0?1:-1),e); } });

// self-playing demo for the recorder
const SCRIPT=[[1.2,()=>go(0)],[5.2,()=>go(1)],[8.5,()=>go(2)],[11.8,()=>go(3)],[15.1,()=>go(4)],[18.4,()=>go(5)],[22.0,()=>toGrid()]];
let si=0, tStart=null;

// ── layout ──
let S=1;
function layout(){
  const vw=document.documentElement.clientWidth, vh=innerHeight;
  if(CLEAN) S=Math.min(vw/AW, vh/AH);
  else if(vw>=900&&vw>vh) S=Math.min((vh-48)/AH,(vw-48-360)/AW);
  else S=(Math.min(vw,560)-32)/AW;
  wrap.style.width=AW*S+'px'; wrap.style.height=AH*S+'px'; stage.style.transform=`scale(${S})`;
}
addEventListener('resize',layout); layout(); sync();

// ── frame ──
function setRect(el,[x,y,w,h]){el.style.left=x+'px';el.style.top=y+'px';el.style.width=w+'px';el.style.height=h+'px'}
function frame(ms){
  const t=ms/1000; if(tStart===null)tStart=t; const pt=t-tStart;
  if(PLAY) while(si<SCRIPT.length&&pt>=SCRIPT[si][0]) SCRIPT[si++][1]();
  let z = mode==='grid'?0:1;
  if(mode==='zoom'){ const k=P(t-zoom.t0,0,ZD); z=eio(zoom.dir>0?k:1-k); if(k>=1){mode=zoom.dir>0?'single':'grid'; zoom=null; z=mode==='single'?1:0; sync()} }
  let wk=0; if(wipe){ wk=P(t-wipe.t0,0,WD); if(wk>=1){finishWipe(); wk=0} }
  const head=1-z;
  // camera: view rect V shrinks geometrically from the stage to the current tile, about a fixed point
  const tr=gridRect(cur), w=AW*Math.pow(GW/AW,z), f=(AW-w)/(AW-GW), V=[f*tr[0],f*tr[1],w,w*AH/AW], K=AW/w;
  cam.style.transform=`translate(${(-V[0]*K).toFixed(3)}px,${(-V[1]*K).toFixed(3)}px) scale(${K.toFixed(5)})`;
  document.getElementById('ghead').style.opacity=head; document.getElementById('gfoot').style.opacity=head;
  tiles.forEach((o,i)=>{
    const s=STYLES[i], isCur=i===cur, isIn=wipe&&wipe.to===i, vis=z<1||isCur||isIn;
    o.tile.style.display=vis?'':'none'; o.lab.style.display=z<1?'':'none';
    if(!vis) return;
    const rect=isIn?V:gridRect(i); setRect(o.tile,rect);
    o.tile.style.zIndex=isIn?3:isCur?2:1;
    o.tile.className='tile'+(z>0?' full':'');
    o.tile.style.opacity=(isCur||isIn)?1:1-.6*z;
    o.tile.style.borderRadius=4*(1-z)+'px';
    if(isIn){ const R=Math.hypot(Math.max(wipe.x,AW-wipe.x),Math.max(wipe.y,AH-wipe.y)), e=eio(wk), q=V[2]/AW;
      o.tile.style.clipPath=`circle(${(R*e*q).toFixed(2)}px at ${(wipe.x*q).toFixed(2)}px ${(wipe.y*q).toFixed(2)}px)`;
      o.art.style.transform=`scale(${q}) translate(${wipe.x}px,${wipe.y}px) scale(${1.06-.06*eo(wk)}) translate(${-wipe.x}px,${-wipe.y}px)`;
    } else { o.tile.style.clipPath=''; o.art.style.transform=`scale(${rect[2]/AW})`; }
    const g=gridRect(i); setRect(o.lab,[g[0],g[1]+g[3]+9,g[2],18]); o.lab.style.opacity=head;
    s.update(o.art,t,t-act[i]);
  });
  if(ripple){ const k=P(t-ripple[2],0,.55), d=14+70*eo(k); Object.assign(rip.style,{left:ripple[0]-d/2+'px',top:ripple[1]-d/2+'px',width:d+'px',height:d+'px',opacity:k<1?1-k:0}); if(k>=1)ripple=null; }
  requestAnimationFrame(frame);
}
// warm the fonts (the Japanese face is split by unicode-range, so ask for the glyphs we use)
['900 20px Archivo','800 20px Archivo','400 20px Archivo','20px VT323','700 20px Fredoka','500 20px Fredoka','700 20px "Pixelify Sans"','400 20px "Pixelify Sans"','italic 20px "Bodoni Moda"','20px "Bodoni Moda"','700 20px "Bodoni Moda"','20px "Instrument Serif"','600 20px "Instrument Sans"']
  .forEach(f=>document.fonts.load(f));
['800 20px "Shippori Mincho"','500 20px "Shippori Mincho"'].forEach(f=>document.fonts.load(f,'手で巻く静かな時間。第六号時計刻二〇年秋 Time,kept'));
requestAnimationFrame(frame);
</script>
